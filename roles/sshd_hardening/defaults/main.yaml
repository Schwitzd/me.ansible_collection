---
# Name starts with 00- so it is read first (sshd uses the first value found),
# ahead of distro/cloud-init drop-ins such as 50-cloud-init.conf
sshd_hardening_config_path: /etc/ssh/sshd_config.d/00-hardening.conf

sshd_hardening_port: 22
sshd_hardening_permit_root_login: "no"
sshd_hardening_permit_empty_passwords: "no"
sshd_hardening_password_authentication: "no"
sshd_hardening_pubkey_authentication: "yes"
sshd_hardening_kbd_interactive_authentication: "no"
sshd_hardening_hostbased_authentication: "no"

sshd_hardening_login_grace_time: 60
sshd_hardening_client_alive_interval: 120
sshd_hardening_max_auth_tries: 3
sshd_hardening_x11_forwarding: "no"
sshd_hardening_allow_tcp_forwarding: "no"
sshd_hardening_allow_agent_forwarding: "no"
sshd_hardening_permit_tunnel: "no"
sshd_hardening_permit_user_environment: "no"

sshd_hardening_allowed_users: []
sshd_hardening_sftp_enabled: false

# Abort when password logins are disabled but no authorized_keys file is found
sshd_hardening_lockout_check: true

# Service to restart (Debian-based systems name it "ssh")
sshd_hardening_service_name: "{{ 'ssh' if ansible_facts['os_family'] | default('') == 'Debian' else 'sshd' }}"
